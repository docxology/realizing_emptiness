conditions:
  - name: separation_constrained
    role: reference
    description: Reference sectorization of the finite boundary-channel model.
  - name: opacified_and_post_dual
    role: proposed
    description: Admissible relabelings of the same specified observation distribution.
  - name: perturbed_boundary
    role: variant
    description: Negative control with a changed boundary distribution.
metrics:
  primary:
    name: absolute deviation from normalized boundary probability mass
    direction: minimize
protocol: >-
  Run scripts/simulate_boundary_agents.py with the admitted GNN specifications.
  Compare the admissible relabelings and the perturbation against the reference
  distribution in output/data/qrf_boundary_indistinguishability.json. The
  comparison tests the finite software model's numerical contract.
expected_figures:
  - fig:qrf_boundary_screen_geometry
  - fig:qrf_channel_relabeling_ledger
  - fig:qrf_invariance_policy_flow
